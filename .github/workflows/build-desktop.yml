name: Build Desktop

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxtst-dev \
            libxi-dev

      - name: Get packages
        run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package
        run: tar -czf skiff-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skiff-linux-x64
          path: skiff-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = "skiff-windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath
          }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skiff-windows-x64
          path: skiff-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            flutter_architecture: x64
          - arch: arm64
            runner: macos-15
            flutter_architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter_architecture }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build
        run: flutter build macos --release --no-codesign

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/skiff.app skiff-macos-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skiff-macos-${{ matrix.arch }}
          path: skiff-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
